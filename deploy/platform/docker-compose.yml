# X-Plore 视频平台本地依赖一键拉起
# 用法：在 deploy/platform 下执行  docker compose up -d
#
# 端口规划：
#   Postgres 5432 | Redis 6379 | MinIO 9000(API)/9101(控制台) | Kafka 9092
#   ClickHouse 8123/9009 | etcd 2379
# 业务服务端口仍由各进程本地启动（user:8001 video:8003 comet:8080）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wavehub
      POSTGRES_PASSWORD: wavehub
      POSTGRES_DB: wavehub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wavehub
      MINIO_ROOT_PASSWORD: wavehub123
    # 控制台宿主端口用 9101:9001 被 user 服务 gRPC 占用
    ports: ["9000:9000", "9101:9001"]
    volumes: [miniodata:/data]

  # 创建 bucket + CORS + HLS 公共读（浏览器直传/播放必需）
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 wavehub wavehub123;
      mc mb -p local/xplore-video || true;
      mc mb -p local/wavehub-audio || true;
      printf '%s' '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\",\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"HEAD\",\"DELETE\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json;
      mc cors set local/xplore-video /tmp/cors.json || mc anonymous set-json /tmp/cors.json local/xplore-video || true;
      mc anonymous set download local/xplore-video || true;
      exit 0;
      "

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    ports: ["2379:2379"]
    volumes: [etcddata:/etcd-data]

  kafka:
    image: bitnami/kafka:3.9
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafkadata:/bitnami/kafka]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9009:9000"]
    volumes: [chdata:/var/lib/clickhouse]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  pgdata:
  miniodata:
  etcddata:
  kafkadata:
  chdata:

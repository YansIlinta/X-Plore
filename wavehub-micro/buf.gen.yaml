# 只对 api 模块生成(third_party 的 google 注解不生成)。
# 用法:cd wavehub-micro && buf generate --path <module 内相对路径,如 social/v1>
#      或生成全部:buf generate --exclude-path ../third_party 视 buf 版本而定,推荐带 --path。
version: v2
plugins:
  - local: protoc-gen-go
    out: api
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api
    opt: paths=source_relative
  - local: protoc-gen-go-http
    out: api
    opt: paths=source_relative

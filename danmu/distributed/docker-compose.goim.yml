# goim 式微服务全链路编排（Comet/Logic/Job + Kafka + ClickHouse + etcd + nginx）。
# 与 ../monolith/docker-compose.yml 并存互不干扰；在本目录执行：
#   docker compose -f docker-compose.goim.yml up -d --build
services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:CONTROLLER
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=10
    networks: [danmu]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks: [danmu]

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command: ["etcd", "--name", "etcd0", "--data-dir", "/etcd-data",
              "--listen-client-urls", "http://0.0.0.0:2379",
              "--advertise-client-urls", "http://etcd:2379",
              "--listen-peer-urls", "http://0.0.0.0:2380",
              "--initial-advertise-peer-urls", "http://etcd:2380",
              "--initial-cluster", "etcd0=http://etcd:2380"]
    volumes: ["etcd-data:/etcd-data"]
    networks: [danmu]

  # -advertise-http 是注册进 etcd 供 Ops Console 拨号的地址，必须是容器网内可达的
  # 服务名:端口。job 尤其不能省：它没有 -advertise，缺省会推出 localhost:7420，
  # 注册上去 ops 会拨到自己身上。
  #
  # -trace-sample 三处必须一致（logic 与 comet 各自独立对 msg_id 做同一套确定性哈希，
  # 值不同就会各采各的、链路永远拼不齐）。写死在这里而不是靠默认值恰好相同。
  logic:
    build: { context: ., dockerfile: Dockerfile.goim }
    command: ["/app/logic", "-addr=:7400", "-id=logic1", "-etcd=http://etcd:2379", "-advertise=logic:7400", "-kafka=kafka:9092", "-http-addr=:7410", "-advertise-http=logic:7410", "-trace-sample=100"]
    ports: ["7410:7410"]
    depends_on: [kafka, etcd]
    networks: [danmu]

  job:
    build: { context: ., dockerfile: Dockerfile.goim }
    command: ["/app/job", "-kafka=kafka:9092", "-etcd=http://etcd:2379", "-http-addr=:7420", "-advertise-http=job:7420", "-trace-sample=100"]
    ports: ["7420:7420"]
    depends_on: [kafka, etcd]
    networks: [danmu]

  comet1:
    build: { context: ., dockerfile: Dockerfile.goim }
    working_dir: /app
    command: ["/app/comet", "-ws-addr=:8080", "-rpc-addr=:7500", "-advertise=comet1:7500", "-advertise-http=comet1:8080", "-id=comet1", "-etcd=http://etcd:2379", "-trace-sample=100"]
    environment: ["DANMU_AUTH_TOKEN=${DANMU_AUTH_TOKEN:-danmu-secret-token}"]
    ports: ["8080:8080"]
    depends_on: [etcd]
    networks: [danmu]

  comet2:
    build: { context: ., dockerfile: Dockerfile.goim }
    working_dir: /app
    command: ["/app/comet", "-ws-addr=:8080", "-rpc-addr=:7500", "-advertise=comet2:7500", "-advertise-http=comet2:8080", "-id=comet2", "-etcd=http://etcd:2379", "-trace-sample=100"]
    environment: ["DANMU_AUTH_TOKEN=${DANMU_AUTH_TOKEN:-danmu-secret-token}"]
    ports: ["8081:8080"]
    depends_on: [etcd]
    networks: [danmu]

  # 落库 consumer 是架构无关的公共组件，源码在 ../monolith，直接以其为 build context
  consumer:
    build: { context: ../monolith, dockerfile: Dockerfile.consumer }
    command: ["./consumer", "-kafka=kafka:9092", "-topic=danmu-broadcast", "-clickhouse-addr=clickhouse:9000", "-mode=storage"]
    depends_on: [kafka, clickhouse]
    networks: [danmu]

  nginx:
    image: nginx:alpine
    ports: ["8088:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [comet1, comet2]
    networks: [danmu]

  # Ops Console 后端：旁路观测，经 etcd 发现 *-http 实例并聚合。
  # 不在消息链路上，挂掉不影响弹幕；depends_on 只为启动顺序好看，
  # 采集循环本身对 etcd/Kafka 不可达是容错的（拿不到就报 null）。
  ops:
    build: { context: ., dockerfile: Dockerfile.goim }
    command: ["/app/ops", "-addr=:7900", "-etcd=http://etcd:2379", "-kafka=kafka:9092", "-kafka-topic=danmu-broadcast"]
    environment: ["DANMU_AUTH_TOKEN=${DANMU_AUTH_TOKEN:-danmu-secret-token}"]
    ports: ["7900:7900"]
    depends_on: [etcd, kafka]
    networks: [danmu]

volumes:
  etcd-data: {}

networks:
  danmu: { driver: bridge }

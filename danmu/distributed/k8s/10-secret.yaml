# 敏感配置与 ConfigMap（10-config.yaml）分开存放。生产覆盖方式：
#   kubectl -n danmu create secret generic danmu-secret \
#     --from-literal=DANMU_AUTH_TOKEN=<强随机> --from-literal=JWT_SECRET=<强随机>
# 本基线保留开发默认值，便于与裸机/compose 对照压测。
apiVersion: v1
kind: Secret
metadata:
  name: danmu-secret
  namespace: danmu
type: Opaque
stringData:
  DANMU_AUTH_TOKEN: "danmu-secret-token" # WS 鉴权 secret + comet 观测 API Bearer token
  JWT_SECRET: "dev-only-change-me"       # 业务 JWT 签名密钥（HS256）

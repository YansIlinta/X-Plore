apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: danmu
spec:
  template:
    spec:
      containers:
        - name: etcd
          command:
            - etcd
            - --name=$(ETCD_NAME)
            - --data-dir=/etcd-data
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(ETCD_NAME).etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(ETCD_NAME).etcd:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380
            - --initial-cluster-state=new
            - --cert-file=/certs/server-$(ETCD_NAME).crt
            - --key-file=/certs/server-$(ETCD_NAME).key
            - --trusted-ca-file=/certs/ca.crt
          livenessProbe:
            httpGet:
              path: /health
              port: client
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: client
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /etcd-data
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: danmu-etcd-tls

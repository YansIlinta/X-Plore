---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-ops-ingress
spec:
  podSelector:
    matchLabels:
      app: ops
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - port: 7900
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-nginx-ingress
spec:
  podSelector:
    matchLabels:
      app: nginx
  ingress:
    - ports:
        - port: 80
{{- end }}

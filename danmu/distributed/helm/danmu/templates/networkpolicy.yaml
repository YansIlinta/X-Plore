  name: danmu-clickhouse-ingress
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: consumer
      ports:
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-comet-ingress
spec:
  podSelector:
    matchLabels:
      app: comet
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: ops
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: job
      ports:
        - port: 7500
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-logic-ingress
spec:

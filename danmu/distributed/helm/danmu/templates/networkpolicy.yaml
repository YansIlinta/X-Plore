        - podSelector:
            matchLabels:
              app: comet
      ports:
        - port: 7400
    - from:
        - podSelector:
            matchLabels:
              app: ops
      ports:
        - port: 7410
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-job-ingress
spec:
  podSelector:
    matchLabels:
      app: job
  ingress:
    - from:

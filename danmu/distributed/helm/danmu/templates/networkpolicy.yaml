{{- if .Values.networkPolicy.enabled }}
# 入向白名单（与 k8s/base/40-networkpolicy.yaml 同矩阵）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-etcd-ingress
spec:
  podSelector:
    matchLabels:
      app: etcd
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: etcd
      ports:
        - port: 2379
        - port: 2380
    - from:
        - podSelector:
            matchLabels:
              app: comet
        - podSelector:
            matchLabels:
              app: logic
        - podSelector:
            matchLabels:
              app: job
        - podSelector:
            matchLabels:
              app: ops
      ports:
        - port: 2379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: danmu-kafka-ingress
spec:
  podSelector:
    matchLabels:
      app: kafka
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: logic
        - podSelector:
            matchLabels:
              app: job
        - podSelector:
            matchLabels:
              app: consumer
      ports:
        - port: 9092
---
apiVersion: networking.k8s.io/v1

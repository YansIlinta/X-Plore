# consumer：Kafka→ClickHouse 落库（镜像从 ../monolith 构建）。无 HTTP 观测面 → 无探针。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: "{{ .Values.consumerImage.repository }}:{{ .Values.consumerImage.tag }}"
          imagePullPolicy: {{ .Values.consumerImage.pullPolicy }}
          command:
            - ./consumer
            - -kafka=kafka:9092
            - -topic=danmu-broadcast
            - -clickhouse-addr=clickhouse:9000
            - -mode=storage
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# ops：旁路观测 Ops Console。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops
  labels:
    app: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops
  template:
    metadata:
      labels:
        app: ops
    spec:
      containers:
        - name: ops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/ops
            - -addr=:7900
            - -etcd=etcd-client:2379
            - -kafka=kafka:9092
            - -poll=2s
          env:
            - name: DANMU_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: danmu-secret, key: DANMU_AUTH_TOKEN }
          ports:
            - name: http
              containerPort: 7900
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ops
  labels:
    app: ops
spec:
  selector:
    app: ops
  ports:
    - name: http
      port: 7900
      targetPort: http

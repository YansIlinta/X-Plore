{{- /*
etcd 3 节点集群：headless `etcd`（peer/per-pod 直连）+ `etcd-client`（应用统一入口）。
initial-cluster 由 replicas 推导；改 replicas 前先做 etcdctl member add/remove（见 values.yaml 注释）。
*/ -}}
{{- $initialCluster := list }}
{{- range $i, $_ := until (int .Values.etcd.replicas) }}
{{- $initialCluster = append $initialCluster (printf "etcd-%d=http://etcd-%d.etcd:2380" $i $i) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  labels:
    app: etcd
spec:
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd
  replicas: {{ .Values.etcd.replicas }}
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: {{ .Values.etcd.image | quote }}
          command:
            - etcd
            - --name=$(ETCD_NAME)
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(ETCD_NAME).etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(ETCD_NAME).etcd:2380
            - --initial-cluster={{ join "," $initialCluster }}
            - --initial-cluster-state=new
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          livenessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /etcd-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# 驱逐/滚动维护时至少保住 2 个 etcd 节点（默认 3 副本的多数派）。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd

# comet：WS 接入层。advertise 用 pod IP 注册进 etcd（job 经 etcd 直连 :7500），
# Service 仅作外部 WS 入口（sessionAffinity ClientIP 承担粘性）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comet
  labels:
    app: comet
spec:
  replicas: {{ .Values.comet.replicas }}
  selector:
    matchLabels:
      app: comet
  template:
    metadata:
      labels:
        app: comet
    spec:
      containers:
        - name: comet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/comet
            - -ws-addr=:8080
            - -rpc-addr=:7500
            - -advertise=$(POD_IP):7500
            - -advertise-http=$(POD_IP):8080
            - -id=$(POD_NAME)
            - -etcd=etcd-client:2379
            - -trace-sample=100
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DANMU_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: danmu-secret, key: DANMU_AUTH_TOKEN }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: danmu-secret, key: JWT_SECRET }
            - name: WS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: danmu-env, key: WS_ALLOWED_ORIGINS }
          ports:
            - name: ws
              containerPort: 8080
            - name: rpc
              containerPort: 7500
          livenessProbe:
            httpGet:
              path: /health
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: ws
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comet
  labels:
    app: comet
spec:
  selector:
    app: comet
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: ws
      port: 8080
      targetPort: ws
---
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: comet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: comet
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilization }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: comet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: comet

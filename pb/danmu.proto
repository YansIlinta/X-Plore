syntax = "proto3";

package danmu;

option go_package = "danmu/pb;pb";

// LogicService: Comet 把上行弹幕转发给 Logic 做过滤/生成 msg_id/写 Kafka。
service LogicService {
  rpc OnMessage(OnMessageReq) returns (OnMessageResp);
}

message OnMessageReq {
  string room_id = 1;
  string uid = 2;
  string content = 3;
  int64 client_ts = 4;
  int64 client_ts_nano = 5;
  string source_comet = 6;
  int64 offset_ms = 7; // 点播播放进度（毫秒）
}

message OnMessageResp {
  string msg_id = 1;
  string filtered = 2; // 过滤后的内容（含 * 打码）
}

// CometService: Job 把某房间的一批消息定向推给持有该房间的 Comet。
service CometService {
  rpc PushRoom(PushRoomReq) returns (PushRoomResp);
}

message PushRoomReq {
  string room_id = 1;
  bytes payload = 2; // 已是发给客户端的最终 JSON（[]Message 数组）
}

message PushRoomResp {
  int32 delivered = 1; // 本机实际投递的连接数；无该房间则 0
}

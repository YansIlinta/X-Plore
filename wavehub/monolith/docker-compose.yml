# 一条命令拉起全部依赖：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wavehub
      POSTGRES_PASSWORD: wavehub
      POSTGRES_DB: wavehub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wavehub
      MINIO_ROOT_PASSWORD: wavehub123
    ports: ["9000:9000", "9001:9001"]   # 9001 是网页控制台
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:

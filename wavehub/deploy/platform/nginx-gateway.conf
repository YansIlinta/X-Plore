# X-Plore 统一入口（可选，Docker/Linux 用）
# 对照 Go 版：wavehub-micro/app/gateway
# 本机无 nginx 时优先用：go run ./app/gateway/cmd  → :8088

worker_processes auto;
events { worker_connections 4096; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream user_svc  { server host.docker.internal:8001; }
    upstream video_svc { server host.docker.internal:8003; }
    upstream comet_svc { server host.docker.internal:8080; }

    server {
        listen 8088;

        location = /health {
            default_type application/json;
            return 200 '{"ok":true,"service":"xplore.gateway.nginx"}';
        }

        location = /ws {
            proxy_pass http://comet_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location ~ ^/v1/(register|login) {
            proxy_pass http://user_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/v1/(videos|me) {
            proxy_pass http://video_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}

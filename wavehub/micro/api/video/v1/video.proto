// X-Plore 点播视频服务契约。
// room_id 约定：字符串形式的 video_id（如 "42"），弹幕 comet 房间与稿件 1:1。
syntax = "proto3";

package api.video.v1;

import "google/api/annotations.proto";

option go_package = "github.com/YansIlinta/wavehub-micro/api/video/v1;v1";

service Video {
  rpc CreateVideo(CreateVideoRequest) returns (CreateVideoReply) {
    option (google.api.http) = {
      post: "/v1/videos"
      body: "*"
    };
  }
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadReply) {
    option (google.api.http) = {
      post: "/v1/videos/{id}/complete"
      body: "*"
    };
  }
  rpc ListVideos(ListVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/v1/videos"};
  }
  // 相关推荐:同分区按热度,排除自身(播放页侧栏)
  rpc ListRelated(ListRelatedRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/v1/videos/{id}/related"};
  }
  rpc GetVideo(GetVideoRequest) returns (VideoInfo) {
    option (google.api.http) = {get: "/v1/videos/{id}"};
  }
  rpc ListMyVideos(ListMyVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/v1/me/videos"};
  }
  // 点播历史弹幕（按播放进度 offset_ms 区间拉取）
  rpc ListDanmu(ListDanmuRequest) returns (ListDanmuReply) {
    option (google.api.http) = {get: "/v1/videos/{id}/danmu"};
  }
  // 持久化一条点播弹幕（JWT）；实时广播仍走 comet WS
  rpc PostDanmu(PostDanmuRequest) returns (PostDanmuReply) {
    option (google.api.http) = {
      post: "/v1/videos/{id}/danmu"
      body: "*"
    };
  }
  // ---- 互动（M5，同库；日后可拆 interact 服务）----
  rpc ListComments(ListCommentsRequest) returns (ListCommentsReply) {
    option (google.api.http) = {get: "/v1/videos/{id}/comments"};
  }
  rpc PostComment(PostCommentRequest) returns (PostCommentReply) {
    option (google.api.http) = {
      post: "/v1/videos/{id}/comments"
      body: "*"
    };
  }
  rpc ToggleLike(ToggleLikeRequest) returns (ToggleLikeReply) {
    option (google.api.http) = {
      post: "/v1/videos/{id}/like"
      body: "*"
    };
  }
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteReply) {
    option (google.api.http) = {
      post: "/v1/videos/{id}/favorite"
      body: "*"
    };
  }
  rpc GetInteractStats(GetInteractStatsRequest) returns (InteractStats) {
    option (google.api.http) = {get: "/v1/videos/{id}/stats"};
  }
  // 内部：media worker 转码完成后回写。videos 表归 video 服务，media 不得直写库。
  rpc ReportProcessed(ReportProcessedRequest) returns (ReportProcessedReply);
}

message CreateVideoRequest {
  string title = 1;
  string description = 2;
  string category = 3; // 分区，如 tech / anime / music
}

message CreateVideoReply {
  uint64 id = 1;
  string upload_url = 2; // MinIO 预签名 PUT
  string room_id = 3;    // 弹幕房间 = 字符串 video id
}

message CompleteUploadRequest {
  uint64 id = 1;
  reserved 2;
  reserved "object_key";
}

message CompleteUploadReply {
  string status = 1; // processing
}

message ListVideosRequest {
  int32 page = 1;
  int32 size = 2;
  string category = 3;
  uint64 user_id = 4; // 按 UP 主过滤(个人空间公开投稿列表)
  string sort = 5;    // ""|"new" 最新;"hot" 按 play_count+3*like 加权
}

message ListRelatedRequest {
  uint64 id = 1;
  int32 limit = 2; // 默认 12,最大 30
}

message ListMyVideosRequest {
  int32 page = 1;
  int32 size = 2;
}

message GetVideoRequest {
  uint64 id = 1;
}

message VideoInfo {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  uint64 user_id = 5;
  string author = 6;
  string status = 7; // uploading / processing / ready / failed
  double duration_sec = 8;
  int64 play_count = 9;
  string cover_url = 10;     // 预签名封面
  string playlist_url = 11;  // 预签名 HLS master/playlist m3u8
  string room_id = 12;       // 弹幕房间 id
  string danmu_ws_hint = 13; // 可选：文档化的 WS 入口提示，如 ws://host/ws
  int64 like_count = 14;
  int64 comment_count = 15;
  int64 favorite_count = 16;
  bool liked = 17;     // 当前用户是否点赞（未登录 false）
  bool favorited = 18; // 当前用户是否收藏
}

message ListVideosReply {
  repeated VideoInfo list = 1;
  int32 total = 2;
}

message ReportProcessedRequest {
  uint64 id = 1;
  bool success = 2;
  double duration_sec = 3;
  string playlist_key = 4; // 如 videos/42/hls/index.m3u8
  string cover_key = 5;    // 如 videos/42/cover.jpg
  string error_message = 6;
}

message ReportProcessedReply {}

message ListDanmuRequest {
  uint64 id = 1;       // video id（= room_id 数字）
  int64 from_ms = 2;   // 含，播放进度毫秒，默认 0
  int64 to_ms = 3;     // 含，0 表示不限上界
  int32 limit = 4;     // 默认 200，最大 1000
}

message DanmuItem {
  string msg_id = 1;
  string uid = 2;
  string content = 3;
  int64 offset_ms = 4; // 相对视频起始的毫秒
  int64 created_at = 5; // unix ms
}

message ListDanmuReply {
  repeated DanmuItem list = 1;
}

message PostDanmuRequest {
  uint64 id = 1;
  string content = 2;
  int64 offset_ms = 3;
}

message PostDanmuReply {
  string msg_id = 1;
  int64 offset_ms = 2;
}

message ListCommentsRequest {
  uint64 id = 1;
  int32 page = 2;
  int32 size = 3;
}

message CommentItem {
  uint64 id = 1;
  uint64 user_id = 2;
  string author = 3;
  string content = 4;
  int64 created_at = 5; // unix ms
}

message ListCommentsReply {
  repeated CommentItem list = 1;
  int32 total = 2;
}

message PostCommentRequest {
  uint64 id = 1;
  string content = 2;
}

message PostCommentReply {
  uint64 id = 1;
}

message ToggleLikeRequest {
  uint64 id = 1;
}

message ToggleLikeReply {
  bool liked = 1;
  int64 like_count = 2;
}

message ToggleFavoriteRequest {
  uint64 id = 1;
}

message ToggleFavoriteReply {
  bool favorited = 1;
  int64 favorite_count = 2;
}

message GetInteractStatsRequest {
  uint64 id = 1;
}

message InteractStats {
  int64 like_count = 1;
  int64 comment_count = 2;
  int64 favorite_count = 3;
  bool liked = 4;
  bool favorited = 5;
}

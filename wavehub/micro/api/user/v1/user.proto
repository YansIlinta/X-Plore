// proto 是微服务的"接口契约"：先定义契约，再生成代码，再写实现（proto-first）。
// 一份 proto 同时生成 gRPC 服务端/客户端 和 HTTP(REST) 路由 —— 这是 Kratos 的核心卖点。
syntax = "proto3";

package api.user.v1;

import "google/api/annotations.proto";

option go_package = "github.com/YansIlinta/wavehub-micro/api/user/v1;v1";

service User {
  // 带 http 注解的 rpc 会同时暴露 REST 接口，给浏览器/前端用
  rpc Register(RegisterRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/register"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }
  // 内部接口：给 track 服务查作者信息用，只走 gRPC，故意不加 http 注解
  rpc GetUser(GetUserRequest) returns (UserInfo);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message AuthReply {
  string token = 1;
  uint64 user_id = 2;
}

message GetUserRequest {
  uint64 id = 1;
}

message UserInfo {
  uint64 id = 1;
  string username = 2;
}
